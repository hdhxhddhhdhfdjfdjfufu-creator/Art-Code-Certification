<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AI 同步翻译</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --surface: #13132a;
      --surface2: #1a1a38;
      --border: #2a2a50;
      --text: #e0e0f0;
      --muted: #7070a0;
      --accent: #5b8fff;
      --accent2: #a78bfa;
      --danger: #ff5555;
      --success: #50fa7b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      /* Prevent iOS bounce on scroll */
      overscroll-behavior: none;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      /* iOS safe area */
      padding-top: max(1rem, env(safe-area-inset-top));
    }
    .logo { font-size: 1.4rem; flex-shrink: 0; }
    .header-text h1 { font-size: 1rem; font-weight: 700; }
    .header-text p  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .ws-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .ws-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s;
    }
    .ws-dot.on { background: var(--success); box-shadow: 0 0 6px var(--success); }

    /* ── Alert banner ── */
    .alert {
      padding: 0.6rem 1.25rem;
      font-size: 0.8rem;
      display: none;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .alert.warn { background: #1a1400; border-bottom: 1px solid #3a3000; color: #ffd060; display: flex; }
    .alert.err  { background: #1a0808; border-bottom: 1px solid #3a1010; color: #ff8080; display: flex; }

    /* ── Language bar ── */
    .lang-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .lang-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
      /* Prevent iOS zoom on focus */
      font-size: max(0.82rem, 16px);
    }
    select:focus { border-color: var(--accent); }

    .swap-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 32px; height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .swap-btn:active { background: var(--border); }

    .auto-tts-label {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .auto-tts-label input { accent-color: var(--accent); width: 16px; height: 16px; }

    /* ── Main panels ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .panel {
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      border-right: 1px solid var(--border);
      overflow: hidden;
      min-height: 0;
    }
    .panel:last-child { border-right: none; }

    .panel-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      flex-shrink: 0;
    }

    .text-box {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      font-size: 1rem;
      line-height: 1.8;
      overflow-y: auto;
      min-height: 160px;
      transition: border-color 0.2s;
      word-break: break-word;
      -webkit-overflow-scrolling: touch;
    }
    .text-box.active     { border-color: var(--accent); }
    .text-box.translating { border-color: var(--accent2); }

    .placeholder-text { color: #3a3a60; font-style: italic; font-size: 0.9rem; }
    .interim-text     { color: var(--muted); font-style: italic; }

    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--accent2);
      border-radius: 1px;
      vertical-align: text-bottom;
      animation: blink 0.65s step-end infinite;
      margin-left: 1px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Text input fallback ── */
    .text-input-wrap {
      display: none;
      gap: 0.5rem;
      align-items: stretch;
    }
    .text-input-wrap.show { display: flex; }
    .manual-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 16px; /* Prevent iOS zoom */
      resize: none;
      font-family: inherit;
      line-height: 1.5;
    }
    .manual-input:focus { outline: none; border-color: var(--accent); }
    .send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      -webkit-tap-highlight-color: transparent;
    }
    .send-btn:active { opacity: 0.8; }

    /* ── History ── */
    .history-wrap {
      border-top: 1px solid var(--border);
      max-height: 160px;
      overflow-y: auto;
      display: none;
      -webkit-overflow-scrolling: touch;
    }
    .history-header {
      padding: 0.5rem 1.25rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
    }
    .history-item {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .h-orig { color: var(--muted); }
    .h-trans { color: var(--accent); }

    /* ── Footer ── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .recording-badge {
      display: none;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--danger);
    }
    .recording-badge.show { display: flex; }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.4); opacity: 0.6; }
    }

    .btn {
      padding: 0.65rem 1.2rem;
      border-radius: 9px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      /* Large enough tap target for touch */
      min-height: 44px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:not(:disabled):active { opacity: 0.8; transform: scale(0.97); }

    .btn-start  { background: linear-gradient(135deg, #5b8fff, #a78bfa); color: #fff; }
    .btn-stop   { background: linear-gradient(135deg, #ff5555, #ff8080); color: #fff; display: none; }
    .btn-speak  { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .btn-clear  { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); margin-left: auto; }

    /* ── iOS-specific tip ── */
    .ios-tip {
      background: #0a1a0a;
      border-bottom: 1px solid #1a3a1a;
      color: #80c080;
      padding: 0.55rem 1.25rem;
      font-size: 0.78rem;
      display: none;
    }

    /* ── Responsive: stack on small screens ── */
    @media (max-width: 600px) {
      main { grid-template-columns: 1fr; }
      .panel { border-right: none; border-bottom: 1px solid var(--border); min-height: 140px; }
      .history-item { grid-template-columns: 1fr; gap: 0.2rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🌐</div>
  <div class="header-text">
    <h1>AI 同步翻译</h1>
    <p>实时语音 · DeepSeek 流式翻译 · TTS 播报</p>
  </div>
  <div class="ws-badge">
    <div class="ws-dot" id="wsDot"></div>
    <span id="wsLabel">连接中</span>
  </div>
</header>

<!-- iOS / HTTPS warning -->
<div class="alert warn" id="httpsWarn">
  ⚠️ 麦克风需要 HTTPS。请通过 https:// 访问，或在本地 localhost 运行。
</div>

<!-- iOS tip -->
<div class="ios-tip" id="iosTip">
  📱 iPad 模式：每句话结束后自动识别，请讲完一句再停顿。
</div>

<!-- Error bar -->
<div class="alert err" id="errorBar"></div>

<div class="lang-bar">
  <div class="lang-group">
    <span>识别</span>
    <select id="sourceLang">
      <option value="zh-CN">中文</option>
      <option value="en-US" selected>English</option>
      <option value="ja-JP">日本語</option>
      <option value="ko-KR">한국어</option>
      <option value="fr-FR">Français</option>
      <option value="de-DE">Deutsch</option>
      <option value="es-ES">Español</option>
      <option value="it-IT">Italiano</option>
      <option value="ru-RU">Русский</option>
    </select>
  </div>

  <button class="swap-btn" id="swapBtn" title="交换语言">⇄</button>

  <div class="lang-group">
    <span>译文</span>
    <select id="targetLang">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="ru">Русский</option>
    </select>
  </div>

  <label class="auto-tts-label">
    <input type="checkbox" id="autoTTS" /> 自动朗读
  </label>
</div>

<main>
  <div class="panel">
    <div class="panel-label">原文（语音识别）</div>
    <div class="text-box" id="sourceBox">
      <span class="placeholder-text">点击"开始录音"后开始说话…</span>
    </div>
    <!-- Text input fallback -->
    <div class="text-input-wrap" id="textInputWrap">
      <textarea class="manual-input" id="manualInput" rows="2" placeholder="或直接输入文字…"></textarea>
      <button class="send-btn" id="sendTextBtn">↑</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-label">译文（AI 翻译）</div>
    <div class="text-box" id="translationBox">
      <span class="placeholder-text">翻译结果将在这里流式显示…</span>
    </div>
  </div>
</main>

<div class="history-wrap" id="historyWrap">
  <div class="history-header">翻译历史</div>
  <div id="historyList"></div>
</div>

<footer>
  <div class="recording-badge" id="recBadge"><div class="rec-dot"></div> 录音中</div>
  <button class="btn btn-start" id="startBtn">🎤 开始录音</button>
  <button class="btn btn-stop"  id="stopBtn">⏹ 停止</button>
  <button class="btn btn-speak" id="speakBtn">🔊 朗读</button>
  <button class="btn btn-clear" id="clearBtn">清空</button>
</footer>

<script>
  // ── Platform detection ──
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  const isIOSSafari = isIOS || isSafari;

  // Warn if not HTTPS and not localhost
  const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isSecure) {
    document.getElementById('httpsWarn').style.display = 'flex';
  }

  if (isIOSSafari) {
    document.getElementById('iosTip').style.display = 'block';
    // Show text input fallback on iOS (as supplement)
    document.getElementById('textInputWrap').classList.add('show');
  }

  // ── WebSocket ──
  const WS_PROTO = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const WS_URL   = `${WS_PROTO}//${location.host}/ws/translate`;

  let ws = null;
  let recognition = null;
  let currentTranslation = '';
  let isRecording = false;

  const wsDot      = document.getElementById('wsDot');
  const wsLabel    = document.getElementById('wsLabel');
  const sourceBox  = document.getElementById('sourceBox');
  const transBox   = document.getElementById('translationBox');
  const errorBar   = document.getElementById('errorBar');
  const recBadge   = document.getElementById('recBadge');
  const startBtn   = document.getElementById('startBtn');
  const stopBtn    = document.getElementById('stopBtn');
  const speakBtn   = document.getElementById('speakBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const swapBtn    = document.getElementById('swapBtn');
  const autoTTS    = document.getElementById('autoTTS');
  const sourceLang = document.getElementById('sourceLang');
  const targetLang = document.getElementById('targetLang');
  const manualInput = document.getElementById('manualInput');

  function connectWS() {
    try { ws = new WebSocket(WS_URL); } catch(e) { return; }
    ws.onopen  = () => { wsDot.classList.add('on'); wsLabel.textContent = '已连接'; };
    ws.onclose = () => { wsDot.classList.remove('on'); wsLabel.textContent = '重连中'; setTimeout(connectWS, 2500); };
    ws.onerror = () => showError('WebSocket 连接失败，请确认后端已启动');
    ws.onmessage = (e) => handleMsg(JSON.parse(e.data));
  }

  function handleMsg(msg) {
    if (msg.type === 'chunk') {
      if (transBox.querySelector('.placeholder-text')) transBox.innerHTML = '';
      removeCursor();
      transBox.appendChild(document.createTextNode(msg.content));
      transBox.appendChild(makeCursor());
      currentTranslation = transBox.textContent;
      transBox.classList.add('translating');
      transBox.scrollTop = transBox.scrollHeight;
    } else if (msg.type === 'done') {
      removeCursor();
      transBox.classList.remove('translating');
      currentTranslation = msg.translation;
      addHistory(msg.original, msg.translation);
      if (autoTTS.checked) speak(msg.translation);
    } else if (msg.type === 'error') {
      showError('翻译错误：' + msg.message);
      transBox.classList.remove('translating');
    }
  }

  function makeCursor() {
    const c = document.createElement('span');
    c.className = 'cursor';
    return c;
  }
  function removeCursor() { transBox.querySelector('.cursor')?.remove(); }

  // ── Speech Recognition ──
  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      showError('此浏览器不支持语音识别。请使用文字输入，或换用 Safari 15+ / Chrome。');
      document.getElementById('textInputWrap').classList.add('show');
      return false;
    }

    recognition = new SR();
    // iOS Safari does NOT support continuous mode — must be false
    recognition.continuous     = !isIOSSafari;
    recognition.interimResults = !isIOSSafari; // iOS Safari interim results are unreliable
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      let interim = '';
      let final_  = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        event.results[i].isFinal ? (final_ += t) : (interim += t);
      }

      if (sourceBox.querySelector('.placeholder-text')) sourceBox.innerHTML = '';

      if (!isIOSSafari) {
        // Desktop: show interim text in grey while speaking
        let interimEl = sourceBox.querySelector('.interim-text');
        if (interim) {
          if (!interimEl) {
            interimEl = document.createElement('span');
            interimEl.className = 'interim-text';
            sourceBox.appendChild(interimEl);
          }
          interimEl.textContent = interim;
        } else if (interimEl) {
          interimEl.remove();
        }
      } else {
        // iOS: treat every result as final (no interim support)
        if (!final_ && interim) final_ = interim;
      }

      if (final_) {
        sourceBox.querySelector('.interim-text')?.remove();
        const p = document.createElement('p');
        p.textContent = final_;
        sourceBox.appendChild(p);
        sourceBox.scrollTop = sourceBox.scrollHeight;
        sendTranslate(final_);
      }
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed') {
        showError('麦克风权限被拒绝。请在系统设置 → Safari → 麦克风 中允许访问。');
        stopRecording();
      } else if (e.error === 'no-speech') {
        // Normal — ignore
      } else {
        showError('语音识别错误：' + e.error);
      }
    };

    recognition.onend = () => {
      // Auto-restart: on iOS single-shot mode; on desktop continuous mode
      if (isRecording) {
        try { recognition.start(); } catch(e) { /* already started */ }
      }
    };

    return true;
  }

  function sendTranslate(text) {
    text = text.trim();
    if (!text) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      showError('WebSocket 未连接，请等待重连后重试');
      return;
    }
    transBox.innerHTML = '';
    currentTranslation = '';
    ws.send(JSON.stringify({ text, target_lang: targetLang.value }));
  }

  // ── Buttons ──
  startBtn.addEventListener('click', () => {
    if (!recognition && !initRecognition()) return;
    hideError();
    recognition.lang = sourceLang.value;
    try {
      recognition.start();
    } catch(e) {
      // Already started — ignore
    }
    isRecording = true;
    startBtn.style.display = 'none';
    stopBtn.style.display  = 'inline-block';
    recBadge.classList.add('show');
    sourceBox.classList.add('active');
  });

  stopBtn.addEventListener('click', stopRecording);

  function stopRecording() {
    isRecording = false;
    try { recognition?.stop(); } catch(e) {}
    startBtn.style.display = 'inline-block';
    stopBtn.style.display  = 'none';
    recBadge.classList.remove('show');
    sourceBox.classList.remove('active');
  }

  speakBtn.addEventListener('click', () => {
    if (currentTranslation) speak(currentTranslation);
  });

  clearBtn.addEventListener('click', () => {
    sourceBox.innerHTML   = '<span class="placeholder-text">点击"开始录音"后开始说话…</span>';
    transBox.innerHTML    = '<span class="placeholder-text">翻译结果将在这里流式显示…</span>';
    transBox.classList.remove('translating');
    document.getElementById('historyWrap').style.display = 'none';
    document.getElementById('historyList').innerHTML = '';
    currentTranslation = '';
    speechSynthesis.cancel();
    manualInput.value = '';
  });

  swapBtn.addEventListener('click', () => {
    const srcCode = sourceLang.value.split('-')[0].toLowerCase();
    const tgtCode = targetLang.value;
    const toSpeech    = { zh:'zh-CN', en:'en-US', ja:'ja-JP', ko:'ko-KR', fr:'fr-FR', de:'de-DE', es:'es-ES', it:'it-IT', ru:'ru-RU' };
    const toTranslate = { zh:'zh', en:'en', ja:'ja', ko:'ko', fr:'fr', de:'de', es:'es', it:'it', ru:'ru' };
    setSelect(sourceLang, toSpeech[tgtCode]    || 'zh-CN');
    setSelect(targetLang, toTranslate[srcCode] || 'zh');
  });

  function setSelect(sel, val) {
    for (const opt of sel.options) {
      if (opt.value === val) { opt.selected = true; return; }
    }
  }

  // ── Text input fallback ──
  document.getElementById('sendTextBtn').addEventListener('click', submitManualText);
  manualInput.addEventListener('keydown', (e) => {
    // Submit on Enter (not Shift+Enter)
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitManualText(); }
  });

  function submitManualText() {
    const text = manualInput.value.trim();
    if (!text) return;
    if (sourceBox.querySelector('.placeholder-text')) sourceBox.innerHTML = '';
    const p = document.createElement('p');
    p.textContent = text;
    sourceBox.appendChild(p);
    manualInput.value = '';
    sendTranslate(text);
  }

  // ── TTS ──
  const ttsLangMap = { zh:'zh-CN', en:'en-US', ja:'ja-JP', ko:'ko-KR', fr:'fr-FR', de:'de-DE', es:'es-ES', it:'it-IT', ru:'ru-RU' };

  function speak(text) {
    speechSynthesis.cancel();
    const utt  = new SpeechSynthesisUtterance(text);
    utt.lang   = ttsLangMap[targetLang.value] || 'zh-CN';
    utt.rate   = 0.95;
    speechSynthesis.speak(utt);
  }

  // ── History ──
  function addHistory(orig, trans) {
    const wrap = document.getElementById('historyWrap');
    const list = document.getElementById('historyList');
    wrap.style.display = 'block';
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<div class="h-orig">${esc(orig)}</div><div class="h-trans">${esc(trans)}</div>`;
    list.insertBefore(item, list.firstChild);
    while (list.children.length > 30) list.removeChild(list.lastChild);
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ── Error ──
  function showError(msg) { errorBar.textContent = '⚠ ' + msg; errorBar.style.display = 'flex'; }
  function hideError()    { errorBar.style.display = 'none'; }

  // ── Init ──
  connectWS();
</script>

</body>
</html>
